name: Idea or feature request
description: Something RackDraw should do (for example a Visio feature you miss).
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: The job you're trying to get done, e.g. "document the patch panels in an IDF and print labels for them".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Visio, another tool, or a workaround in RackDraw.
  - type: textarea
    id: more
    attributes:
      label: Anything else (optional)
      description: Screenshots of how another tool does it, or a sample file (without real client data).
