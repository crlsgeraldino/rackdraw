# Checks every pull request and every push to master: types, lint, unit tests (including the file-reader fuzz),
# then the real desktop app driven end to end by Playwright (every ribbon button, save / restart / reopen, every
# export, CAD and network-scan import). The Microsoft Office check is skipped here (no Office on the runner).
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src tests e2e
      - name: Unit tests
        run: npm test
      - name: Third-party notices are up to date
        run: |
          npm run notices
          git diff --exit-code -- THIRD-PARTY-NOTICES.md
      - name: Build
        run: npm run build
      - name: End-to-end tests (desktop app)
        run: npx playwright test
      - name: Keep the end-to-end report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
